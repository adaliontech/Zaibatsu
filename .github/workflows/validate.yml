name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run offline contract validation
        run: make validate
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-8.30.1"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
            | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - name: Scan Git history and release tree for secrets
        run: |
          gitleaks git . --redact --no-banner --log-opts="--all"
          gitleaks dir . --redact --no-banner
